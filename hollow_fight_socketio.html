SCRX.guide=d=>{d.innerHTML=bkb+`<h2>📖 GUIA COMPLETO</h2>
<h3>🎮 Controles</h3><p>O <b>joystick</b> (ou WASD/setas) move seu ❤ dentro da arena durante os ataques. Os botões embaixo comandam o herói da vez. ⏸ pausa e 🔊 liga/desliga o som.</p>
<h3>⚔ Turnos</h3><p>Cada herói vivo age uma vez: <b>ATACAR</b>, <b>AÇÃO</b> (aumenta a PIEDADE e a mecânica do chefão), <b>MAGIA 1</b>, <b>MAGIA 2</b>, <b>DEFENDER</b>, <b>ITENS</b> ou <b>POUPAR</b>. Depois o chefão ataca e você desvia.</p>
<h3>⚡ TP</h3><p>O TP é compartilhado. Sobe <b>+4%</b> quando você passa perto de um ataque sem ser atingido (aparece uma bolinha azul ao redor do ❤) e quando defende. Magias gastam TP.</p>
<h3>🧑 Heróis e magias</h3><p><b>Guerreira</b> — Corte Estelar (90 de dano; depois ela fica <b>3 turnos sem magia</b>) e Grito de Guerra (equipe +50% de dano por 2 turnos). Defender: Postura de Ferro (-75% de dano).<br><b>Justiceiro</b> — Sentença Final (130 de dano, mas ele <b>perde 50% da vida</b>) e Tiro Certeiro (atravessa escudos). Defender: Contra-ataque (próximo golpe x1.6).<br><b>Calmo</b> — Zen Absoluto (cura a equipe e causa dano) e Onda de Paz (+piedade e cura). <b>As armaduras aumentam a cura, o dano e a piedade das magias dele.</b> Defender: Meditação (+HP).</p>
<h3>🛡 Equipamentos</h3><p>Cada chefão derrotado ou poupado dá 1 peça para cada herói. Armas aumentam ataque e magia; armaduras aumentam HP e (para o Calmo) o poder das magias. Equipe em 🛡 ARMADURAS. Peças também podem ser compradas na loja.</p>
<h3>🧪 Itens</h3><p>Poção e Pena de Fênix pedem que você escolha o <b>alvo</b>: qualquer herói, ou arremessar a Poção no chefão (-30). Éter e Elixir afetam a equipe. Cada herói também tem 1 item único por luta.</p>
<h3>🕊 Pacifista</h3><p>Use AÇÕES para encher a PIEDADE até 100% e então POUPAR. Poupar dá +50% de moedas e um final melhor.</p>
<h3>👹 Chefões e mecânicas</h3><p>👑 <b>Supremo</b>: cortes lentos que, ao acertar, lançam bolas de energia. Fúria sobe todo turno.<br>💻 <b>Rainha</b>: ergue um <b>escudo de energia</b> a cada 3 turnos; o Firewall reduz o seu dano. Hackear ajuda.<br>🤡 <b>Palhaço</b>: caixas-surpresa, tortas e bolas saltitantes. Cansaço → fica exausto.<br>🟢 <b>Slime</b>: gosma que cai e deixa poças. ⚡ <b>Glitch</b>: tiros teleportados. 🔥 <b>Dragão</b>: meteoros com aviso no chão. ⛈ <b>Capitão</b>: ondas e canhão. ❄ <b>Lich</b>: estalactites.<br>⚔ <b>Cavaleiro Glitch</b> (só no Difícil): cortes precisos e rápidos.</p>

function mpConnect(code,host){
  code=(code||'').toUpperCase().trim();

  mpPage(code,host?'Criando sala online...':'Entrando na sala...');

    if(!window.io)throw new Error('Socket.IO não carregou. Verifique se o servidor está ativo.');
    if(mpSocket){try{mpSocket.disconnect()}catch(e){}}
    const socket=mpSocket=io({transports:['websocket','polling']});
    const peerTag=()=>socket.id;
    const handlers={};
    const rm={
      peerId:null,
      emit:function(k,d){if(socket.connected)socket.emit('game_relay',{event:k,data:d})},
      on:function(k,fn){handlers[k]=fn},
      leave:function(){try{socket.emit('leave_room');socket.disconnect()}catch(e){}}
    };
    socket.on('connect',()=>{
      const action=host?'create_room':'join_room';
      const args=host?{code,name:'Anfitrião'}:{code,name:'Jogador'};
      socket.emit(action,args,result=>{
        if(!result||!result.ok){
          alert((result&&result.error)||'Não foi possível entrar na sala.');

        rm.peerId=socket.id;
        MP={rm,host:!!host,code:actualCode,me:socket.id,owner:[null,null,null],pl:new Set(),pc:1,live:false,local:false,socket};
        rm.on('lob',onLob);rm.on('cmd',onCmd);
        rm.on('inp',m=>{INP[m.peer]=m.data});rm.on('st',onSt);
        socket.on('game_relay',msg=>{
          if(!msg||!msg.event)return;
          const fn=handlers[msg.event];
          if(fn)fn({data:msg.data,peer:msg.peer,sameTab:false});
        });
        socket.on('room_changed',room=>{
          if(!MP)return;
          MP.pc=room.players.length;
          MP.pl=new Set(room.players.map(p=>p.id));
          if(MP.host)syncLob();
        });
        socket.on('disconnect',()=>{
          if(MP&&MP.socket===socket){MP=null;MPG=false;alert('Conexão com a sala encerrada.');scr('mp')}
        });
        if(host){
          MP.pl.add(socket.id);MP.owner[0]=socket.id;
          setTimeout(()=>{rm.emit('lob',{k:'sync',o:MP.owner,n:1,d:dsel});scr('mp2')},100);
        }else{
          MP.pl.add(socket.id);
          setTimeout(()=>{rm.emit('lob',{k:'hello'});scr('mp2')},100);
        }
      });
    });
    socket.on('connect_error',err=>{
      console.warn('Socket.IO',err);
      alert('Não foi possível conectar ao servidor. Verifique a internet e tente novamente.');
      if(MP&&MP.socket===socket)MP=null;
      scr('mp');
    });
  }catch(e){alert('Erro online: '+(e.message||e));MP=null;scr('mp')}
}

(function(){
  const _ht = typeof ht==='function' ? ht : null;
  if(_ht){
    window.ht = function(h,q){
      if(h.k==='sword'||h.k==='orb'){
        let d=Math.hypot(q.x-h.x,q.y-h.y);
        return d<(h.r||8)+3?2:d<(h.r||8)+14?1:0;
      }
      return _ht(h,q);
    };
  }
  // mover sword/orb no loop de hz (patch após update existente)
  const _upd2 = update;
  update = function(){
    if(typeof soulSlow!=='undefined' && soulSlow>0 && st==='dodge'){
      // já reduz jv no patch anterior; reforça half speed no heart
    }
    let r = _upd2.apply(this,arguments);
    try{
      if(st==='dodge'){
        hz.forEach(h=>{
          if(h.k==='sword'||h.k==='orb'){
            if(h.hm){
              let t = (typeof heart!=='undefined')?heart:{x:320,y:150};
              h.vx += Math.sign(t.x-h.x)*0.04;
              h.vy += Math.sign(t.y-h.y)*0.04;
              let sp=Math.hypot(h.vx,h.vy)||1;
              h.vx=h.vx/sp*1.9; h.vy=h.vy/sp*1.9;
            }
            h.x+=h.vx; h.y+=h.vy;
            if(h.life!=null){ h.life--; if(h.life<=0) h.dead=1; }
            if(h.x<AX-20||h.x>AX+AW+20||h.y<AY-20||h.y>AY+AH+20) h.dead=1;
          }
        });
        hz = hz.filter(h=>!h.dead);
      }
    }catch(e){}
    return r;
  };
})();

    if(typeof soulSlow!=='undefined'&&soulSlow>0){
      soulSlow--;
      if(typeof jv!=='undefined'){jv.x*=0.5;jv.y*=0.5}
    }
    let r=_updAtk.apply(this,arguments);
    try{
      if(st==='dodge'){
        hz.forEach(h=>{
          if(h.k==='sword'||h.k==='orb'||h.k==='spear'){
            if(h.hm){
              h.vx+=Math.sign(heart.x-h.x)*0.05;
              h.vy+=Math.sign(heart.y-h.y)*0.05;
              let sp=Math.hypot(h.vx,h.vy)||1;
              h.vx=h.vx/sp*2.0;h.vy=h.vy/sp*2.0;

            if(h.x<AX-30||h.x>AX+AW+30||h.y<AY-30||h.y>AY+AH+30)h.dead=1;
          }
          if(h.k==='warn'){
            h.t--;h.life--;if(h.life<=0)h.dead=1;
          }
        });
        // colisão extra
        let targets=(typeof HS!=='undefined'&&HS&&HS.length)?HS:[heart];
        hz.forEach(h=>{
          if(h.dead)return;
          if(h.k==='sword'||h.k==='orb'||h.k==='spear'){
            targets.forEach(q=>{
              if(q.inv>0)return;
              let d=Math.hypot(q.x-h.x,q.y-h.y);
              if(d<(h.r||7)+3){
                if(typeof hitHero==='function') hitHero(q);
                else if(typeof inv!=='undefined'){ /* single heart path handled elsewhere */ }
              }else if(d<(h.r||7)+14 && typeof graze==='function') graze(h,q);
            });
          }
        });
        hz=hz.filter(h=>!h.dead);
      }
    }catch(e){}
    return r;
  };

  // ht() support
  if(typeof ht==='function'){
    const _ht2=ht;
    ht=function(h,q){
      if(h.k==='sword'||h.k==='orb'||h.k==='spear'){
        let d=Math.hypot(q.x-h.x,q.y-h.y);
        return d<(h.r||8)+3?2:d<(h.r||8)+14?1:0;
      }
      if(h.k==='warn') return 0;
      return _ht2(h,q);
    };
  }

  console.log('[V8.2] ataques únicos por chefe + loot fixo na vila');
})();

 function connect(){

 }
 function send(o){if(sock&&sock.readyState===1)sock.send(JSON.stringify(o));}

    const W=14,Ht=8,wall=new Set();
    for(let x=0;x<W;x++){wall.add(x+',0');wall.add(x+','+(Ht-1));}for(let y=0;y<Ht;y++){wall.add('0,'+y);wall.add((W-1)+','+y);}
    [[4,1],[4,2],[4,3],[7,2],[8,2],[9,2],[10,4],[10,5],[2,4],[3,4],[6,5]].forEach(([x,y])=>wall.add(x+','+y));
    const draw=()=>{let tiles='';for(let y=0;y<Ht;y++)for(let x=0;x<W;x++){let key=x+','+y,blocked=wall.has(key),isP=x===c2.x&&y===c2.y;let col=blocked?'#26334a':((x+y)%2?'#153d38':'#194a3e');let label='';if(x===2&&y===6)label='🚩';if(x===6&&y===1)label='🧩';if(x===6&&y===3)label='🟢';if(x===11&&y===2)label='👾';if(x===12&&y===6)label='🌸';if(x===8&&y===6)label='🗿';tiles+=`<div style="width:100%;aspect-ratio:1;background:${col};border:1px solid #35534e;display:flex;align-items:center;justify-content:center;font-size:clamp(12px,2.4vw,22px);position:relative">${isP?'🧙':label}</div>`;}
      return `<div style="display:grid;grid-template-columns:repeat(${W},1fr);gap:2px;background:#0c1820;border:3px solid #8b5cf6;padding:4px;max-width:760px;margin:auto">${tiles}</div>`;};
    o.innerHTML=`<div style="max-width:850px;margin:auto"><h2 style="color:#e879f9;text-align:center">🌸 CAPÍTULO 2 — JARDIM ENTRE MUNDOS</h2><p id="c2msg" style="text-align:center">${message}</p>${draw()}<div style="display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:12px"><button onclick="c2Move(0,-1)">⬆</button><button onclick="c2Move(-1,0)">⬅</button><button onclick="c2Move(0,1)">⬇</button><button onclick="c2Move(1,0)">➡</button><button class="p" onclick="c2Interact()">🔎 INTERAGIR</button></div><p style="text-align:center"><small>Movimente-se pelo mapa. Resolva o mecanismo 🧩, derrote os minibosses 🟢👾 e siga até a Flor Ômega 🌸. Controles: setas do teclado ou botões.</small></p><div style="display:flex;justify-content:center;gap:8px"><button onclick="scr('home')">← MENU</button><button onclick="chapter2Reset()">↻ REINICIAR MAPA</button></div></div>`;
    window._c2Walls=[...wall];
  }
  window.chapter2Map=chapter2Map;
  window.c2Move=(dx,dy)=>{let nx=c2.x+dx,ny=c2.y+dy;if(window._c2Walls.includes(nx+','+ny))return;c2.x=nx;c2.y=ny;c2.steps++;chapter2Map();};
  window.c2Interact=()=>{
    let {x,y}=c2;
    if((x===6&&y===1)||(x===8&&y===6)){if(!c2.bridge){c2.bridge=true;chapter2Map('🧩 ENIGMA RESOLVIDO! Você alinhou os três cristais. A passagem para o jardim interno foi aberta.');}else chapter2Map('O mecanismo já está ativo.');return;}
    if((x===6&&y===3)||(x===5&&y===3)){if(!c2.slime){let i=B.findIndex(b=>b.n==='SLIME REI (mini-chefe)');c2StartBoss('slime',i);}else chapter2Map('A poça guardiã já foi vencida.');return;}
    if((x===11&&y===2)||(x===11&&y===3)){if(!c2.ghost){let i=B.findIndex(b=>b.n==='FANTASMA GLITCH (mini-chefe)');c2StartBoss('ghost',i);}else chapter2Map('O fantasma deixou o caminho livre.');return;}
    if((x===12&&y===6)||(x===12&&y===5)){if(!c2.bridge){chapter2Map('A barreira está fechada. Resolva o enigma dos cristais 🧩 primeiro.');return;}if(!c2.slime||!c2.ghost){chapter2Map('Duas presenças ainda protegem o jardim. Derrote os minibosses 🟢 e 👾.');return;}c2StartBoss('flower',oldFlowerBoss);return;}
    chapter2Map('Nada por aqui... procure os símbolos do mapa e pressione INTERAGIR.');
  };
  window.chapter2Reset=()=>{c2={x:1,y:6,keys:0,bridge:false,slime:false,ghost:false,flower:false,steps:0};chapter2Map('O mapa foi reiniciado.');};
  window.chapter2=function(){chapter2Map();};
  window.addEventListener('keydown',e=>{if(!$('ov')||$('ov').style.display==='none')return;if(!document.getElementById('c2msg'))return;let d={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0]}[e.key];if(d){e.preventDefault();c2Move(d[0],d[1]);}if(e.key===' '||e.key==='Enter'){e.preventDefault();c2Interact();}});

  // Enzo aparece também como chefe opcional no menu de desafios.
  const homeBefore=SCRX.home;SCRX.home=d=>{homeBefore&&homeBefore(d);let box=d.querySelector('div')||d;if(!box.innerHTML.includes('chapter2()'))box.insertAdjacentHTML('beforeend','<button class="p" onclick="chapter2()">🌸 CAPÍTULO 2 — EXPLORAR</button>');if(!box.innerHTML.includes('enzoBoss'))box.insertAdjacentHTML('beforeend','<button onclick="fight(dsel,'+enzoIndex+',false,[0,1,2])">⚔ BOSS SECRETO: ENZO</button>');};
  // O Cavaleiro recupera um golpe hit-kill raro na fase 2: aviso visual + execução evitável.
  if(knightIndex>=0){B[knightIndex].p2.push(['knExecute','EXECUÇÃO DO ÚLTIMO GUARDIÃO']);}
  const spawnBeforeExecute=spawn;
  spawn=function(nm){
    if(nm==='knExecute'){
      if(f===1){info='☠ O CAVALEIRO PREPARA UM HIT-KILL! DESVIE DA LÂMINA VERMELHA!';flash=12;}
      if(f===78){let a=Math.atan2(heart.y-(AY+AH/2),heart.x-(AX+AW-8));hz.push({k:'sword',x:AX+AW-8,y:AY+AH/2,vx:Math.cos(a)*3.1,vy:Math.sin(a)*3.1,r:10,col:'#ff1744',life:150,rot:a,oneHit:1});}
      return;
    }
    return spawnBeforeExecute.apply(this,arguments);
  };
  if(typeof hitHero==='function'){
    const hitHeroBefore=hitHero;
    hitHero=function(q){
      if(q&&q.oneHit){let p=q.h>=0?P.find(x=>x.id==q.h):pick(P.filter(x=>x.hp>0));if(!p||p.hp<=0)return;
        if(p.def===2||p.enzoGuard){p.hp=Math.max(1,p.hp-18);info='🛡 A defesa/guarda do Enzo impediu o hit-kill!';q.inv=50;return;}
        p.hp=0;p.hf=12;q.inv=50;shk=18;flash=12;fl.push({t:'EXECUÇÃO!',x:HP_[P.indexOf(p)].x+8,y:HP_[P.indexOf(p)].y,l:55,c:'#ff1744'});if(!P.some(x=>x.hp>0))lose();return;
      }
      return hitHeroBefore.apply(this,arguments);
    };
  }
  console.log('[HOLLOW FIGHT V13] versões fundidas, armadura, Enzo, zoom e Capítulo 2 explorável.');
})();

</script>
<script>
// ===== V14: FLOR OMEGA NAS BATALHAS LIVRES + CAVALEIRO HIT-KILL =====
(()=>{
  const knightIndex=B.findIndex(b=>b.n==='CAVALEIRO GLITCH');
  const flowerIndex=B.findIndex(b=>b.n==='FLOR OMEGA');

  // A Flor Ômega agora aparece diretamente na lista de Batalhas Livres.
  const previousBossScreen=SCRX.boss;
  SCRX.boss=function(d){
    if(previousBossScreen)previousBossScreen(d);
    if(flowerIndex>=0){
      d.insertAdjacentHTML('beforeend',`<h2 style="color:#e879f9">🌸 CHEFÃO DO CAPÍTULO 2</h2>
      <div class="row"><span style="color:#e879f9"><b>FLOR ÔMEGA</b> — HP ${B[flowerIndex].hp}<br><small>Combate em duas formas. Ao chegar a 22% de vida, desperta a Flor Ômega verdadeira, com ataques mais rápidos e difíceis.</small></span><button class="p" onclick="fight(dsel,${flowerIndex},false,[0,1,2])">🌸 LUTAR</button></div>`);
    }
    if(knightIndex>=0){
      const row=d.querySelectorAll('.row');
      row.forEach(r=>{if(r.textContent.includes('CAVALEIRO GLITCH')){const small=r.querySelector('small');if(small)small.textContent='CADA GOLPE É HIT KILL. Ataques novos, combos e execução na fase 2. Só no Difícil.';}});
    }
  };

  // O Cavaleiro mantém o requisito de dificuldade, mas seus golpes voltam a eliminar
  // instantaneamente o herói atingido. O modo treino continua sem dano.
  if(knightIndex>=0){
    B[knightIndex].ds='Guardião do servidor. Cada golpe é HIT KILL: qualquer herói atingido é derrotado instantaneamente. Ataques especiais e combos nas duas fases. Só no Difícil.';
    B[knightIndex].p1=[
      ['knStorm','CHUVA DE ESPADAS'],['knCross','CORTES CRUZADOS'],['knSword','LÂMINA PERSEGUIDORA'],
      ['knScream','GRITO DE PRESSÃO'],['knOrbit','ÓRBITA DE LÂMINAS']
    ];
    B[knightIndex].p2=[
      ['knCombo','COMBO DE EXECUÇÃO'],['knStorm','TEMPESTADE DE LÂMINAS'],['knCross','X DO CAVALEIRO'],
      ['knSword','CORTE TELEGUIADO'],['knMeteor','QUEDA DAS ESPADAS'],['knRift','FENDAS DO ARQUIVO']
    ];
    B[knightIndex].u=['knCombo','knMeteor','knRift'];
    B[knightIndex].un='SENTENÇA DO ARQUIVO';
    B[knightIndex].ul='NÃO EXISTE SEGUNDA CHANCE!!';
    B[knightIndex].t=['Um golpe. Um arquivo apagado.','Não tente bloquear o inevitável.','A armadura não esquece nenhum erro.','O próximo corte será o último.'];
  }

  const previousKnightSpawn=spawn;
  spawn=function(nm){
    const cx=AX+AW-10,cy=AY+AH/2;
    if(nm==='knOrbit'){
      if(f%46===0){for(let j=0;j<10;j++){let a=j*Math.PI/5+f*.025;hz.push({k:'c',x:cx,y:cy,vx:Math.cos(a)*2.25,vy:Math.sin(a)*2.25,r:7,col:'#a5b4fc',life:145});}}
      return;
    }
    if(nm==='knMeteor'){
      if(f%58===0){for(let j=0;j<5;j++){let x=AX+24+j*49;hz.push({k:'r',x,y:AY,w:15,h:AH,t:25,life:26,col:'#ff304f',warn:1});if(j%2===0)hz.push({k:'c',x,y:AY+8,vx:-.35,vy:3.1,r:8,col:'#fda4af',life:130});}}
      return;
    }
    if(nm==='knRift'){
      if(f%64===0){for(let j=0;j<3;j++){let y=AY+22+j*58;hz.push({k:'r',x:AX,y,w:AW,h:12,t:32,life:24,col:'#c084fc',warn:1});hz.push({k:'c',x:AX+AW,y,vx:-3.4,vy:(cy-y)*.012,r:8,col:'#e9d5ff',life:125});}}
      return;
    }
    return previousKnightSpawn.apply(this,arguments);
  };

  const previousHitHero=hitHero;
  hitHero=function(q){
    if(bi!==knightIndex)return previousHitHero.apply(this,arguments);
    if(train){q.inv=45;fl.push({t:'TREINO: sem dano',x:q.x||heart.x,y:(q.y||heart.y)-10,l:40,c:'#8cf'});return;}
    let alive=P.filter(x=>x.hp>0);
    let p=q&&q.h>=0?P.find(x=>x.id==q.h):pick(alive);
    if(!p||p.hp<=0)return;
    const i=P.indexOf(p);p.hp=0;p.hf=14;q.inv=55;shk=18;flash=12;
    const pos=HP_[Math.max(0,Math.min(HP_.length-1,i))]||heart;
    fl.push({t:'☠ HIT KILL!',x:pos.x+8,y:pos.y,l:65,c:'#ff1744'});
    say(B[knightIndex],pick(['Um golpe. É o bastante.','Arquivo apagado.','Eu avisei: não há segunda chance.','A armadura executa.']));
    if(!P.some(x=>x.hp>0))lose();
  };

  console.log('[HOLLOW FIGHT V14] Flor Ômega nas Batalhas Livres; Cavaleiro com hit-kill e ataques extras.');
})();
